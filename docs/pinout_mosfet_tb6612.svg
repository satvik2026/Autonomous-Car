<text x="690.0" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#1a1a1a">Autonomous Car Pinout — MOSFET Driver System (2x TB6612FNG)</text>
<text x="690.0" y="62" text-anchor="middle" font-size="13.5" fill="#555">MOSFET H-bridges: near-zero voltage drop, 3.3V-native logic, one motor per channel. Same 6 GPIO as before.</text>
