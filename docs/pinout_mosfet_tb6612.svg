<line x1="966.0" y1="612" x2="988.0" y2="612" stroke="#777777" stroke-width="3"/>
<text x="993.0" y="616" font-size="10.5" fill="#333">motor output</text>
<rect x="1055" y="120" width="300" height="439" rx="8" fill="#FFFDF3" stroke="#C9A200" stroke-width="1.6"/><text x="1205.0" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">MOSFET (TB6612FNG) notes</text>
<text x="1069" y="164" font-size="11" fill="#333" font-weight="bold">Why MOSFET:</text>
<text x="1069" y="183" font-size="11" fill="#333" font-weight="normal">- Rds(on) very low -&gt; ~0.1-0.3V drop vs</text>
<text x="1069" y="202" font-size="11" fill="#333" font-weight="normal">  L298N's ~2-3V. Motor gets almost the</text>
<text x="1069" y="221" font-size="11" fill="#333" font-weight="normal">  full pack voltage = more torque/volt.</text>
<text x="1069" y="240" font-size="11" fill="#333" font-weight="normal">- Runs cool: little wasted heat, so it</text>
<text x="1069" y="259" font-size="11" fill="#333" font-weight="normal">  sustains current on a hill without</text>
<text x="1069" y="278" font-size="11" fill="#333" font-weight="normal">  thermal cut-out.</text>
<text x="1069" y="297" font-size="11" fill="#333" font-weight="normal"></text>
<text x="1069" y="316" font-size="11" fill="#333" font-weight="bold">Native 3.3V logic (VCC=3.3V):</text>
<text x="1069" y="335" font-size="11" fill="#333" font-weight="normal">GPIO drives it directly; no 5V, no</text>
<text x="1069" y="354" font-size="11" fill="#333" font-weight="normal">level shifting, no divider on controls.</text>
<text x="1069" y="373" font-size="11" fill="#333" font-weight="normal"></text>
<text x="1069" y="392" font-size="11" fill="#333" font-weight="bold">STBY must be HIGH to run: tie to 3V3</text>
<text x="1069" y="411" font-size="11" fill="#333" font-weight="normal">(or a GPIO for an all-motor e-stop).</text>
<text x="1069" y="430" font-size="11" fill="#333" font-weight="normal"></text>
<text x="1069" y="449" font-size="11" fill="#333" font-weight="bold">Rating: 1.2A cont / 3.2A peak per ch.</text>
<text x="1069" y="468" font-size="11" fill="#333" font-weight="normal">One motor per channel keeps margin.</text>
<text x="1069" y="487" font-size="11" fill="#333" font-weight="normal">Heavier motors -&gt; BTS7960 (up to ~40A).</text>
<text x="1069" y="506" font-size="11" fill="#333" font-weight="normal"></text>
<text x="1069" y="525" font-size="11" fill="#333" font-weight="bold">VM max 13.5V: use 7.4V; avoid 3S full.</text>
<text x="1069" y="544" font-size="11" fill="#333" font-weight="bold">Common ground + separate Pi bank as before.</text>
</svg>