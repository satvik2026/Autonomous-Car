<rect x="560" y="675" width="250" height="95" rx="8" fill="#FBEAEA" stroke="#B00020" stroke-width="1.6"/><text x="685.0" y="697" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Battery pack (motor supply, VM)</text>
<text x="574" y="719" font-size="11" fill="#333">7.4V 2S Li-ion / 6xAA NiMH ideal (&lt;=13.5V)</text>
<text x="574" y="737" font-size="11" fill="#333">MOSFET drop ~0.1-0.3V -&gt; motor sees ~full pack V</text>
<text x="574" y="755" font-size="11" fill="#333">More torque/volt, cooler, longer runtime</text>
<rect x="50" y="675" width="175" height="85" rx="8" fill="#EAF3EA" stroke="#2E8B57" stroke-width="1.6"/><text x="137.5" y="697" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">USB power bank</text>
<text x="137.5" y="721" text-anchor="middle" font-size="10.5" fill="#333">5V / >=2.5A -> Pi</text>
<text x="137.5" y="737" text-anchor="middle" font-size="10.5" fill="#333">(separate from motors)</text>
