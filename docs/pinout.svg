<text x="60" y="772" font-size="16" font-weight="bold" fill="#1a1a1a">Legend</text>
<rect x="60" y="784" width="20" height="20" rx="4" fill="#FBE6D4" stroke="#E8833A" stroke-width="2"/>
<text x="88" y="799" font-size="13" fill="#222">Motors (L293D)</text>
<rect x="206.0" y="784" width="20" height="20" rx="4" fill="#D6E9F7" stroke="#2F86C5" stroke-width="2"/>
<text x="234.0" y="799" font-size="13" fill="#222">Ultrasonic</text>
<rect x="324.0" y="784" width="20" height="20" rx="4" fill="#ECE1F5" stroke="#8E5FBF" stroke-width="2"/>
<text x="352.0" y="799" font-size="13" fill="#222">IR (optional)</text>
<rect x="463.0" y="784" width="20" height="20" rx="4" fill="#F8DADA" stroke="#D64545" stroke-width="2"/>
<text x="491.0" y="799" font-size="13" fill="#222">5V</text>
<rect x="525.0" y="784" width="20" height="20" rx="4" fill="#DCDCDC" stroke="#444444" stroke-width="2"/>
<text x="553.0" y="799" font-size="13" fill="#222">GND (common)</text>
<rect x="820" y="766" width="380" height="150" rx="8" fill="#F7FBFF" stroke="#2F86C5" stroke-width="1.5"/>
<text x="836" y="790" font-size="14" font-weight="bold" fill="#2F86C5">Mandatory: HC-SR04 ECHO voltage divider</text>
<text x="836" y="812" font-size="12" fill="#333">ECHO outputs 5V; Pi GPIO is 3.3V-only.</text>
<text x="836" y="830" font-size="12" fill="#333">Drop it before GPIO24 or you may damage the Pi.</text>
<text x="836" y="858" font-size="12" font-family="monospace" fill="#111">ECHO --[1k]--+--[2k]--GND</text>
<text x="836" y="876" font-size="12" font-family="monospace" fill="#111">            |</text>
<text x="836" y="894" font-size="12" font-family="monospace" fill="#111">          GPIO24  (~3.3V) </text>
<rect x="60" y="828" width="740" height="250" rx="8" fill="#FBFBFB" stroke="#ccc" stroke-width="1.5"/>
<text x="76" y="854" font-size="15" font-weight="bold" fill="#1a1a1a">Two separate power supplies — tie grounds together</text>
<text x="76" y="880" font-size="12.5" fill="#D64545" font-family="monospace">USB POWER BANK (5V, &gt;=2.5A)  --micro-USB--&gt;  Raspberry Pi 3B+</text>
<text x="76" y="904" font-size="12.5" fill="#E8833A" font-family="monospace">9V battery (upgrade to 7.2V pack for hills)  --&gt;  L293D VCC2 (pin 8) = motor supply</text>
<text x="76" y="928" font-size="12.5" fill="#444444" font-family="monospace">COMMON GROUND: Pi GND  &lt;-&gt;  L293D GND (pins 4,5,12,13)  &lt;-&gt;  battery -  &lt;-&gt;  sensor GND</text>
<text x="76" y="978" font-size="13" font-weight="bold" fill="#1a1a1a">L293D channels (skid steer)</text>
<text x="76" y="1000" font-size="12" fill="#333" font-family="monospace">LEFT  pair  -&gt; OUT1/OUT2 | dir IN1=GPIO5, IN2=GPIO6  | speed EN1=GPIO12</text>
<text x="76" y="1022" font-size="12" fill="#333" font-family="monospace">RIGHT pair  -&gt; OUT3/OUT4 | dir IN3=GPIO20,IN4=GPIO21 | speed EN2=GPIO13</text>
<text x="76" y="1044" font-size="12" fill="#333" font-family="monospace">VCC1(pin16)=Pi 5V (logic)   VCC2(pin8)=motor battery +</text>
<rect x="820" y="930" width="380" height="130" rx="8" fill="#F4FBF6" stroke="#2E9E5B" stroke-width="1.5"/>
<text x="836" y="956" font-size="14" font-weight="bold" fill="#2E9E5B">Camera</text>
<text x="836" y="980" font-size="12" fill="#333">Connects to the CSI ribbon port,</text>
<text x="836" y="997" font-size="12" fill="#333">NOT to any GPIO pin.</text>
<text x="836" y="1014" font-size="12" fill="#333">Ribbon contacts face the HDMI port.</text>
<text x="836" y="1031" font-size="12" fill="#333">Enable in raspi-config; use picamera2</text>
<text x="836" y="1048" font-size="12" fill="#333">(64-bit Raspberry Pi OS).</text>
