<rect x="0" y="0" width="1240" height="1120" fill="#ffffff"/>
<text x="620" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a">Raspberry Pi 3B+ — Autonomous Car Pinout</text>
<text x="620" y="66" text-anchor="middle" font-size="14" fill="#555">40-pin GPIO header (BCM names). Highlighted pins are used. Pin 1 = top-left (nearest the SD card / board corner).</text>
