<text x="1068" y="182" font-size="10.6" fill="#333" font-weight="bold">No voltage divider needed:</text>
<text x="1068" y="200" font-size="10.6" fill="#333" font-weight="normal">VEGA tolerates the 5V ECHO pulse,</text>
<text x="1068" y="218" font-size="10.6" fill="#333" font-weight="normal">so ECHO wires straight to a pin.</text>
<text x="1068" y="236" font-size="10.6" fill="#333" font-weight="normal"></text>
<text x="1068" y="254" font-size="10.6" fill="#333" font-weight="bold">3.3V outputs still drive the L298N</text>
<text x="1068" y="272" font-size="10.6" fill="#333" font-weight="normal">(input HIGH threshold ~2.3V).</text>
<text x="1068" y="290" font-size="10.6" fill="#333" font-weight="normal"></text>
<text x="1068" y="308" font-size="10.6" fill="#333" font-weight="bold">L298N jumpers:</text>
<text x="1068" y="326" font-size="10.6" fill="#333" font-weight="normal">- 5V-EN ON (9V -&gt; onboard 5V logic)</text>
<text x="1068" y="344" font-size="10.6" fill="#333" font-weight="normal">- remove ENA/ENB jumpers for PWM</text>
<text x="1068" y="362" font-size="10.6" fill="#333" font-weight="normal"></text>
<text x="1068" y="380" font-size="10.6" fill="#333" font-weight="bold">ENA/ENB on PWM (~) pins; analogWrite.</text>
<text x="1068" y="398" font-size="10.6" fill="#333" font-weight="bold">Common ground: VEGA &lt;-&gt; L298N &lt;-&gt; 9V -.</text>
<text x="1068" y="416" font-size="10.6" fill="#333" font-weight="bold">Arduino IDE: board = ARIES v2.0.</text>
