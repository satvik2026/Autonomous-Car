<text x="1068" y="182" font-size="10.6" fill="#333" font-weight="bold">ECHO needs a voltage divider:</text>
<text x="1068" y="200" font-size="10.6" fill="#333" font-weight="normal">Pi GPIO is 3.3V; HC-SR04 ECHO is 5V.</text>
<text x="1068" y="218" font-size="10.6" fill="#333" font-weight="normal">1k in series + 2k to GND -&gt; ~3.3V.</text>
<text x="1068" y="236" font-size="10.6" fill="#333" font-weight="normal"></text>
<text x="1068" y="254" font-size="10.6" fill="#333" font-weight="bold">L298N jumpers:</text>
<text x="1068" y="272" font-size="10.6" fill="#333" font-weight="normal">- 5V-EN ON (9V -&gt; onboard 5V logic)</text>
<text x="1068" y="290" font-size="10.6" fill="#333" font-weight="normal">- remove ENA/ENB jumpers for PWM</text>
<text x="1068" y="308" font-size="10.6" fill="#333" font-weight="normal"></text>
<text x="1068" y="326" font-size="10.6" fill="#333" font-weight="bold">Common ground: Pi &lt;-&gt; L298N &lt;-&gt; 9V -.</text>
<text x="1068" y="344" font-size="10.6" fill="#333" font-weight="bold">Pi on its own power bank.</text>
<text x="1068" y="362" font-size="10.6" fill="#333" font-weight="bold">Control code: gpiozero, same 6 GPIO</text>
<text x="1068" y="380" font-size="10.6" fill="#333" font-weight="normal">for 2WD and 4WD.</text>
