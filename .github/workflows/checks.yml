# CI for the autonomous car.
#
# WHAT THIS IS FOR
# ================
# The car's code cannot be fully tested here: there is no Pi, no motors, no
# camera and no ultrasonic sensor on a GitHub runner. So this workflow does not
# pretend to test driving. It tests the things that are decided at a keyboard
# and only fail on the course -- where the cost of finding out is a wrecked run
# in front of an audience.
#
# Three layers, cheapest first:
#
#   1. Everything still parses. A syntax error in a file you did not open is
#      invisible until the moment the car runs it.
#   2. The mission file is sane. Every stage can time out, behaviours are
#      spelled correctly, and every colour cue names something that exists.
#      These are the failures that hang or misdirect a run rather than crash
#      it, so nothing else catches them.
#   3. The ground-sensor maths and debounce hold. The mount geometry is a
#      decision made once with a drill, and the debounce only misbehaves on
#      ground rough enough to bounce the car -- neither is testable on the day.
#
# Python 3.11 matches Raspberry Pi OS Bookworm. Only numpy is installed:
# gpiozero and picamera2 are imported lazily inside the functions that touch
# hardware, and OpenCV is guarded behind try/except, so every module imports
# without them.

name: checks

# Triggers are deliberately NOT `push: ['**']` plus `pull_request`. That pair
# runs the whole suite twice on every commit of an open PR -- once for the push
# to the branch, once for the PR -- which is pure waste. Work on this repo goes
# branch -> PR -> main, so: PRs are checked on every update (against the merge
# result, which is what actually lands), and main is checked on push. The
# trade-off is that a branch with no PR open yet gets no CI; open the PR, or
# run it by hand from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run already in flight for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # numpy is the only hard import in the on-car code.
        run: python -m pip install --quiet numpy

      - name: Everything compiles
        run: python -m compileall -q autonomous_car.py simple_obstacle_avoider.py course demos tests

      - name: Mission files are valid JSON
        # Cheap and specific: a trailing comma here is a run that never starts,
        # and the error would otherwise surface on the Pi.
        run: |
          for f in course/missions/*.json; do
            python -c "import json,sys; json.load(open(sys.argv[1])); print('ok', sys.argv[1])" "$f"
          done

      - name: Tests
        run: python -m unittest discover -s tests -t tests -v

      - name: Ground-sensor geometry tool runs
        # Smoke test of the CLI itself: the tests import its functions, this
        # catches a broken entry point or argparse change.
        run: |
          python course/tools/calibrate_ground.py --geometry
          python course/tools/calibrate_ground.py --height 0.20 --tilt 35
